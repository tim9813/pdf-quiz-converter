<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF → Quiz</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>PDF → Quiz</h1>
        <p class="sub">Upload a PDF and get an interactive multiple-choice quiz. Sessions save locally so you don't pay tokens twice.</p>
      </header>

      <div id="config-banner" class="banner" hidden></div>

      <form id="form">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="application/pdf" hidden />
          <span id="drop-label">Drop a PDF here, or click to choose</span>
        </label>

        <div class="row range-row">
          <label class="pages-input">
            Pages
            <input type="text" id="pages" placeholder="e.g. 1,3,5-8,12 — or leave blank for all" />
          </label>
          <label class="quick">
            Quick set
            <select id="quick">
              <option value="">—</option>
              <option value="all">All pages</option>
              <option value="1-5">First 5</option>
              <option value="1-10">First 10</option>
              <option value="1-25">First 25</option>
            </select>
          </label>
        </div>
        <p class="hint" id="page-hint">Leave blank for all pages. Use commas and ranges, e.g. <code>1,3,5-8,12</code>.</p>

        <button id="go" type="submit" disabled>Generate quiz</button>
      </form>

      <section id="sessions-panel" class="sessions-panel">
        <div class="sessions-head">
          <h2>Saved sessions</h2>
          <div class="actions">
            <button id="import-btn" type="button" class="ghost">Import .json</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden />
          </div>
        </div>
        <div id="sessions-list" class="sessions-list"></div>
      </section>

      <section id="status" hidden></section>

      <section id="results" hidden>
        <div class="results-head">
          <div>
            <h2><span id="score">0</span> / <span id="total">0</span> correct</h2>
            <p class="hint" id="meta"></p>
          </div>
          <div class="actions">
            <button id="save" type="button">Rename</button>
            <button id="export" type="button" class="ghost">Export .json</button>
            <button id="reveal" type="button" class="ghost">Reveal all</button>
            <button id="reset" type="button" class="ghost">Reset answers</button>
          </div>
        </div>

        <div id="usage" class="usage"></div>

        <div id="questions"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
